name: GLaDOS scheduled check-in

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Execution mode (live performs real check-in and notifications)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live
  schedule:
    - cron: "0 4,10 * * *"

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: glados/railgun check-in
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run check-in or configuration dry-run
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_mode }}" != "live" ]]; then
            python checkin.py --dry-run
          else
            python checkin.py
          fi
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT }}
          RAILGUN_COOKIES: ${{ secrets.RAILGUN_COOKIES }}
          CUSTOM_DOMAIN_COOKIES: ${{ secrets.CUSTOM_DOMAIN_COOKIES }}
          GLADOS_DOMAINS: ${{ vars.GLADOS_DOMAINS }}
          GLADOS_ALLOW_CUSTOM_DOMAINS: ${{ vars.GLADOS_ALLOW_CUSTOM_DOMAINS }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          GLADOS_ENABLE_EXCHANGE: ${{ vars.GLADOS_ENABLE_EXCHANGE }}
          RAILGUN_EXCHANGE_PLAN: ${{ secrets.RAILGUN_EXCHANGE_PLAN }}
          RAILGUN_ENABLE_EXCHANGE: ${{ vars.RAILGUN_ENABLE_EXCHANGE }}
          GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}
          GLADOS_RETRY_MAX: ${{ vars.GLADOS_RETRY_MAX }}
          GLADOS_RETRY_BACKOFF: ${{ vars.GLADOS_RETRY_BACKOFF }}
          PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
